<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Artikel - Dijokiin</title>

    <meta name="description"
          content="Artikel Dijokiin">

    <!-- Google Font -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: 'Inter', sans-serif;

            background: #f8fafc;

            color: #1e293b;

            line-height: 1.8;

        }


        a {

            text-decoration: none;

            color: inherit;

        }


        .container {

            width: min(850px, 90%);

            margin: auto;

        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {

            background: #ffffff;

            border-bottom: 1px solid #e2e8f0;

            position: sticky;

            top: 0;

            z-index: 1000;

        }


        .nav-container {

            width: min(1100px, 90%);

            min-height: 72px;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;

        }


        .logo {

            font-size: 22px;

            font-weight: 800;

            color: #0f172a;

        }


        .logo span {

            color: #2563eb;

        }


        .nav-links {

            display: flex;

            align-items: center;

            gap: 28px;

            list-style: none;

        }


        .nav-links a {

            font-size: 14px;

            font-weight: 600;

            color: #475569;

        }


        .nav-links a:hover {

            color: #2563eb;

        }


        /* =========================
           ARTICLE
        ========================= */

        .article-container {

            padding: 70px 0 90px;

        }


        .back-link {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            color: #2563eb;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 30px;

        }


        .back-link:hover {

            color: #1d4ed8;

        }


        .article-date {

            color: #64748b;

            font-size: 14px;

            margin-bottom: 15px;

        }


        .article-date i {

            margin-right: 6px;

        }


        #article-title {

            font-size: clamp(32px, 5vw, 48px);

            line-height: 1.2;

            color: #0f172a;

            margin-bottom: 30px;

        }


        /* =========================
           CONTENT
        ========================= */

        #article-content {

            background: #ffffff;

            border: 1px solid #e2e8f0;

            border-radius: 18px;

            padding: 40px;

            font-size: 16px;

        }


        #article-content p {

            margin-bottom: 20px;

        }


        #article-content h2 {

            font-size: 28px;

            line-height: 1.3;

            margin: 35px 0 15px;

            color: #0f172a;

        }


        #article-content h3 {

            font-size: 22px;

            line-height: 1.3;

            margin: 30px 0 12px;

            color: #0f172a;

        }


        #article-content ul,

        #article-content ol {

            margin: 0 0 20px 25px;

        }


        #article-content li {

            margin-bottom: 8px;

        }


        #article-content a {

            color: #2563eb;

            text-decoration: underline;

        }


        #article-content img {

            max-width: 100%;

            height: auto;

            border-radius: 12px;

            margin: 20px 0;

        }


        #article-content blockquote {

            border-left: 4px solid #2563eb;

            padding-left: 20px;

            margin: 25px 0;

            color: #64748b;

        }


        /* =========================
           LOADING
        ========================= */

        .loading {

            text-align: center;

            padding: 80px 20px;

            color: #64748b;

        }


        .loading i {

            font-size: 28px;

            margin-bottom: 15px;

        }


        /* =========================
           ERROR
        ========================= */

        .error-message {

            text-align: center;

            padding: 70px 20px;

            color: #b91c1c;

        }


        /* =========================
           FOOTER
        ========================= */

        footer {

            background: #0f172a;

            color: #cbd5e1;

            padding: 30px 0;

            text-align: center;

            font-size: 14px;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {

            .nav-container {

                min-height: 64px;

            }


            .nav-links {

                gap: 15px;

            }


            .nav-links a {

                font-size: 12px;

            }


            .article-container {

                padding: 45px 0 60px;

            }


            #article-content {

                padding: 25px 20px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <nav class="navbar">

        <div class="nav-container">


            <a href="/" class="logo">

                Di<span>Jokiin</span>

            </a>


            <ul class="nav-links">

                <li>
                    <a href="/">Beranda</a>
                </li>

                <li>
                    <a href="/#layanan">Layanan</a>
                </li>

                <li>
                    <a href="/artikel.html">Artikel</a>
                </li>

                <li>
                    <a href="/#faq">FAQ</a>
                </li>

            </ul>


        </div>

    </nav>



    <!-- =========================
         ARTICLE
    ========================= -->

    <main>

        <div class="container article-container">


            <a href="/artikel.html"
               class="back-link">

                <i class="fa-solid fa-arrow-left"></i>

                Kembali ke Artikel

            </a>


            <div id="article">

                <div class="loading">

                    <i class="fa-solid fa-spinner fa-spin"></i>

                    <p>Memuat artikel...</p>

                </div>

            </div>


        </div>

    </main>



    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        <div class="container">

            © 2026 Dijokiin. All rights reserved.

        </div>

    </footer>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>


        const WORDPRESS_API =
            'https://cms.dijokiin.site/wp-json/wp/v2/posts';


        const articleContainer =
            document.getElementById('article');


        /*
         * Ambil slug dari URL
         *
         * Contoh:
         *
         * artikel-detail.html?slug=artikel-percobaan
         *
         * hasil:
         *
         * artikel-percobaan
         */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const slug =
            urlParams.get('slug');



        /*
         * Kalau slug tidak ditemukan
         */

        if (!slug) {

            articleContainer.innerHTML = `

                <div class="error-message">

                    <i class="fa-solid fa-triangle-exclamation"></i>

                    <h2>Artikel tidak ditemukan</h2>

                    <p>
                        URL artikel tidak valid.
                    </p>

                </div>

            `;

        }



        /*
         * Ambil artikel berdasarkan slug
         */

        async function loadArticle() {

            try {


                const response = await fetch(

                    WORDPRESS_API +
                    '?slug=' +
                    encodeURIComponent(slug)

                );


                if (!response.ok) {

                    throw new Error(
                        'Gagal mengambil artikel.'
                    );

                }


                const articles =
                    await response.json();


                /*
                 * Artikel tidak ditemukan
                 */

                if (articles.length === 0) {

                    articleContainer.innerHTML = `

                        <div class="error-message">

                            <i class="fa-solid fa-circle-exclamation"></i>

                            <h2>Artikel tidak ditemukan</h2>

                            <p>
                                Artikel yang kamu cari tidak tersedia.
                            </p>

                        </div>

                    `;

                    return;

                }


                /*
                 * Ambil artikel pertama
                 */

                const article =
                    articles[0];


                /*
                 * Format tanggal
                 */

                const date =
                    new Date(
                        article.date
                    ).toLocaleDateString(

                        'id-ID',

                        {

                            day: 'numeric',

                            month: 'long',

                            year: 'numeric'

                        }

                    );


                /*
                 * Tampilkan artikel
                 */

                articleContainer.innerHTML = `

                    <div class="article-date">

                        <i class="fa-regular fa-calendar"></i>

                        ${date}

                    </div>


                    <h1 id="article-title">

                        ${article.title.rendered}

                    </h1>


                    <article id="article-content">

                        ${article.content.rendered}

                    </article>

                `;


                /*
                 * Update title browser
                 */

                document.title =
                    article.title.rendered +
                    ' - Dijokiin';


                /*
                 * Update meta description
                 */

                const description =
                    document.querySelector(
                        'meta[name="description"]'
                    );


                if (description) {

                    description.setAttribute(

                        'content',

                        article.excerpt.rendered
                            .replace(/<[^>]*>/g, '')
                            .trim()

                    );

                }


            } catch (error) {


                console.error(error);


                articleContainer.innerHTML = `

                    <div class="error-message">

                        <i class="fa-solid fa-triangle-exclamation"></i>

                        <h2>
                            Gagal memuat artikel
                        </h2>

                        <p>
                            Silakan coba lagi nanti.
                        </p>

                    </div>

                `;

            }

        }



        /*
         * Jalankan hanya kalau slug tersedia
         */

        if (slug) {

            loadArticle();

        }

    </script>


</body>

</html>
