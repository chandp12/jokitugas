name: Generate Articles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate articles
        run: |

          python <<'PY'

          import json
          import os
          import re
          import html
          import urllib.request
          import ssl


          API_URL = "https://cms.dijokiin.site/wp-json/wp/v2/posts"

          TEMPLATE_PATH = "templates/article-template.html"


          print("Mengambil artikel dari WordPress...")


          # ---------------------------------
          # Ambil data WordPress
          # ---------------------------------

          ssl_context = ssl._create_unverified_context()


          with urllib.request.urlopen(
              API_URL,
              context=ssl_context
          ) as response:

              data = response.read()

              posts = json.loads(data)


          print("Jumlah artikel:", len(posts))


          # ---------------------------------
          # Baca template
          # ---------------------------------

          with open(
              TEMPLATE_PATH,
              "r",
              encoding="utf-8"
          ) as file:

              template = file.read()


          # ---------------------------------
          # Fungsi membersihkan HTML
          # ---------------------------------

          def clean_text(value):

              value = re.sub(
                  r"<[^>]+>",
                  "",
                  value
              )

              value = html.unescape(value)

              value = re.sub(
                  r"\s+",
                  " ",
                  value
              )

              return value.strip()


          # ---------------------------------
          # Generate setiap artikel
          # ---------------------------------

          for post in posts:

              slug = post["slug"]

              title = post["title"]["rendered"]

              content = post["content"]["rendered"]

              excerpt = clean_text(
                  post["excerpt"]["rendered"]
              )


              # ---------------------------------
              # Format tanggal
              # ---------------------------------

              date = post["date"][:10]

              year, month, day = date.split("-")


              date_formatted = (
                  f"{day} "
                  f"{month} "
                  f"{year}"
              )


              # ---------------------------------
              # Buat folder artikel
              # ---------------------------------

              article_directory = slug


              os.makedirs(
                  article_directory,
                  exist_ok=True
              )


              # ---------------------------------
              # Masukkan data ke template
              # ---------------------------------

              article_html = template


              article_html = article_html.replace(
                  "{{TITLE}}",
                  title
              )


              article_html = article_html.replace(
                  "{{DESCRIPTION}}",
                  excerpt
              )


              article_html = article_html.replace(
                  "{{SLUG}}",
                  slug
              )


              article_html = article_html.replace(
                  "{{DATE}}",
                  date_formatted
              )


              article_html = article_html.replace(
                  "{{CONTENT}}",
                  content
              )


              # ---------------------------------
              # Simpan index.html
              # ---------------------------------

              output_path = os.path.join(
                  article_directory,
                  "index.html"
              )


              with open(
                  output_path,
                  "w",
                  encoding="utf-8"
              ) as file:

                  file.write(article_html)


              print(
                  "Berhasil membuat:",
                  output_path
              )


          PY


      # ---------------------------------
      # Commit hasil generate
      # ---------------------------------

      - name: Commit generated articles
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add .


          git diff --cached --quiet || git commit -m "Generate articles from WordPress"


          git push
