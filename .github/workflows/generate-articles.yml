name: Generate Articles

on:
  repository_dispatch:
    types:
      - wordpress_post_published

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate article
        run: |
          python3 <<'PY'
          import json
          import html
          from pathlib import Path

          print("Membaca data dari WordPress...")

          event_file = Path(
              __import__("os").environ["GITHUB_EVENT_PATH"]
          )

          event = json.loads(
              event_file.read_text(
                  encoding="utf-8"
              )
          )

          client_payload = event.get(
              "client_payload"
          )

          if not client_payload:
              raise RuntimeError(
                  "client_payload tidak ditemukan."
              )

          post = client_payload.get(
              "post"
          )

          if not post:
              raise RuntimeError(
                  "Data post tidak ditemukan."
              )

          slug = post["slug"]

          title = post["title"]

          content = post["content"]

          excerpt = post["excerpt"]

          date = post["date"]

          yoast_head = post.get("yoast_head", "")

          yoast_head = yoast_head.replace(
          "https://cms.dijokiin.site",
          "https://dijokiin.site"
          )

          yoast_head = yoast_head.replace(
          "http://cms.dijokiin.site",
           "https://dijokiin.site"
          )

          print(
              f"Artikel diterima: {title}"
          )

          print(
              f"Slug: {slug}"
          )

          template_path = Path(
              "templates/article-template.html"
          )

          if not template_path.exists():
              raise FileNotFoundError(
                  "templates/article-template.html tidak ditemukan."
              )

          template = template_path.read_text(
              encoding="utf-8"
          )

          article_html = template

          article_html = article_html.replace(
              "{{TITLE}}",
              html.escape(
                  title,
                  quote=True
              )
          )

          article_html = article_html.replace(
          "{{YOAST_HEAD}}",
          yoast_head
          )

          article_html = article_html.replace(
              "{{DESCRIPTION}}",
              html.escape(
                  excerpt,
                  quote=True
              )
          )

          article_html = article_html.replace(
              "{{SLUG}}",
              html.escape(
                  slug,
                  quote=True
              )
          )

          article_html = article_html.replace(
              "{{DATE}}",
              date
          )

          article_html = article_html.replace(
              "{{CONTENT}}",
              content
          )

          article_dir = Path(slug)

          article_dir.mkdir(
              parents=True,
              exist_ok=True
          )

          output_file = (
              article_dir / "index.html"
          )

          output_file.write_text(
              article_html,
              encoding="utf-8"
          )

          print(
              f"Berhasil membuat: {output_file}"
          )
          PY

      - name: Commit generated article
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "Generate article from WordPress"
            git push
          fi
