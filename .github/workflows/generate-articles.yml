name: Generate Articles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download WordPress posts
        run: |
          echo "Mengambil artikel dari WordPress..."

          curl -k -L --fail --silent --show-error \
            "https://cms.dijokiin.site/wp-json/wp/v2/posts?per_page=100&status=publish" \
            -o posts.json

          echo "API WordPress berhasil diakses."

      - name: Generate article pages
        run: |
          python3 <<'PY'
          import json
          import html
          import re
          from pathlib import Path

          print("Membaca data artikel...")

          with open("posts.json", "r", encoding="utf-8") as f:
              posts = json.load(f)

          template_path = Path("templates/article-template.html")

          if not template_path.exists():
              raise FileNotFoundError(
                  "templates/article-template.html tidak ditemukan."
              )

          template = template_path.read_text(
              encoding="utf-8"
          )

          print(f"Ditemukan {len(posts)} artikel.")

          for post in posts:
              slug = post["slug"]
              title = post["title"]["rendered"]
              content = post["content"]["rendered"]
              date = post["date"][:10]

              description = re.sub(
                  r"<[^>]+>",
                  "",
                  post["excerpt"]["rendered"]
              )

              description = re.sub(
                  r"\s+",
                  " ",
                  description
              ).strip()

              article_html = template

              article_html = article_html.replace(
                  "{{TITLE}}",
                  html.escape(title, quote=True)
              )

              article_html = article_html.replace(
                  "{{DESCRIPTION}}",
                  html.escape(description, quote=True)
              )

              article_html = article_html.replace(
                  "{{SLUG}}",
                  html.escape(slug, quote=True)
              )

              article_html = article_html.replace(
                  "{{DATE}}",
                  date
              )

              article_html = article_html.replace(
                  "{{CONTENT}}",
                  content
              )

              article_dir = Path(slug)
              article_dir.mkdir(
                  parents=True,
                  exist_ok=True
              )

              output_file = article_dir / "index.html"

              output_file.write_text(
                  article_html,
                  encoding="utf-8"
              )

              print(
                  f"Berhasil membuat: {output_file}"
              )

          print(
              f"Selesai membuat {len(posts)} halaman artikel."
          )
          PY

      - name: Commit generated articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "Generate article pages"
            git push
          fi
