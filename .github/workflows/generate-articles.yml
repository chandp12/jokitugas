name: Generate Articles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate test article
        run: |
          python3 <<'PY'
          from pathlib import Path

          template_path = Path(
              "templates/article-template.html"
          )

          if not template_path.exists():
              raise FileNotFoundError(
                  "templates/article-template.html tidak ditemukan."
              )

          template = template_path.read_text(
              encoding="utf-8"
          )

          article = template.replace(
              "{{TITLE}}",
              "Artikel Percobaan"
          )

          article = article.replace(
              "{{DESCRIPTION}}",
              "Ini adalah artikel percobaan dari Dijokiin."
          )

          article = article.replace(
              "{{SLUG}}",
              "artikel-percobaan"
          )

          article = article.replace(
              "{{DATE}}",
              "2026-09-02"
          )

          article = article.replace(
              "{{CONTENT}}",
              "<p>Ini adalah artikel percobaan.</p><p>Halaman ini berhasil dibuat otomatis oleh GitHub Actions.</p>"
          )

          article_dir = Path(
              "artikel-percobaan"
          )

          article_dir.mkdir(
              parents=True,
              exist_ok=True
          )

          output_file = (
              article_dir / "index.html"
          )

          output_file.write_text(
              article,
              encoding="utf-8"
          )

          print(
              f"Berhasil membuat: {output_file}"
          )
          PY

      - name: Commit generated article
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add artikel-percobaan/index.html

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "Generate test article"
            git push
          fi
